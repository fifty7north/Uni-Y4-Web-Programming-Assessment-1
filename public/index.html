<!DOCTYPE html>
<head>
  <link rel="stylesheet" type="text/css" href="css/style.css" />

  <link
    href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />

<body>
  <div class="utilities">
    <p id="playersConnected">Players: 0</p>
    <p id="score">Score: 0</p>
    <p id="lives">Lives: 3</p>
    <div class="utilityButtons">
      <button onclick="togglePlay()" id="music">♫</button>
      <button onclick="menuWindow(); stop();" id="home">X</button>
    </div>
  </div>
  <div class="gameWindow" id="splash">
    <h1>Skydivers</h1>
    <div class="menuButtons">
      <button onclick="playWindow(); startGame(); init()" id="playButton">
        Play
      </button>
    </div>
  </div>
  <canvas id="easelcan" width="1200" height="800"></canvas>
  <div class="gameWindow" id="gameOver">
    <h1>Game Over!</h1>
    <h2 id="finalScoreDisplay">You Scored 0 points</h2>
    <div class="menuButtons">
      <button onclick="restartGame()" id="playButton">Restart</button>
    </div>
  </div>
</body>
